name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) แปลงน้ำหนัก TrackNet (TensorFlow) -> tracknet.tflite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert TrackNet weights to TFLite
        run: |
          pip install tensorflow-cpu==2.15.1
          python tools/convert_tf_to_tflite.py --out app/src/main/assets/tracknet.tflite
      - uses: actions/upload-artifact@v4
        with:
          name: tracknet-tflite
          path: app/src/main/assets/tracknet.tflite

      # 2) สร้าง APK (โมเดลถูกฝังในแอป)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ShuttleTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
